name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore matching core module
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f core/common/build.gradle.kts ]; then
            rm -rf core
            git clone --filter=blob:none https://github.com/maxrave-dev/core.git core
          fi
          # Agar aapko kisi specific commit ki jagah latest main branch chahiye toh yeh use karein:
          git -C core checkout main || true
          test -f core/common/build.gradle.kts
          test -f core/data/build.gradle.kts

      - name: Prepare required directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p config
          chmod +x ./gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK workflow
        shell: bash
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace --no-configuration-cache
          else
            ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace --no-configuration-cache
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          find androidApp/build/outputs/apk -type f -name '*.apk' -print -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SQLplayer-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
