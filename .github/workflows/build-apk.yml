name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options: [release, debug]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore core source
        shell: bash
        run: |
          set -e
          if [ ! -d core/common ] || [ ! -f core/common/build.gradle.kts ]; then
            rm -rf core
            git clone --depth 1 --single-branch --branch multiplatform https://github.com/maxrave-dev/core.git core
          fi
          test -f core/common/build.gradle.kts
          test -f core/data/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        shell: bash
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          set -e
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace --no-configuration-cache
          else
            ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace --no-configuration-cache
          fi

      - name: Collect APK
        run: |
          set -e
          mkdir -p artifacts
          find androidApp/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SQLplayer-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
