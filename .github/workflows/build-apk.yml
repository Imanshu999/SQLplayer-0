name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options: [release, debug]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore core
        run: |
          set -euo pipefail
          rm -rf core
          git clone --depth 1 --branch main https://github.com/maxrave-dev/core.git core
          test -f core/common/build.gradle.kts
          test -f core/data/build.gradle.kts
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Prepare
        run: |
          mkdir -p config
          chmod +x gradlew
      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :androidApp:clean :androidApp:assembleDebug --no-daemon --stacktrace --no-configuration-cache
          else
            ./gradlew :androidApp:clean :androidApp:assembleRelease --no-daemon --stacktrace --no-configuration-cache
          fi
      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find androidApp/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -name '*.apk' -print -quit)"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SQLplayer-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
