name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore required core source
        run: |
          set -e
          if [ ! -f core/settings.gradle.kts ]; then
            rm -rf core
            git clone --depth 1 --branch multiplatform https://github.com/maxrave-dev/core.git core
          fi
          test -f core/settings.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release/debug APK
        shell: bash
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          set -e
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace --no-configuration-cache
          else
            ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace --no-configuration-cache
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          find androidApp/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SQLplayer-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
