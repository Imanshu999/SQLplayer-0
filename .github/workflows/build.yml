name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify core source
        run: |
          test -f core/settings.gradle.kts || test -d core/common
          git submodule status
          ls -la core | head -50

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Generate library metadata if supported
        run: ./gradlew exportLibraryDefinitions --no-daemon --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find androidApp/build/outputs/apk -type f -name "*.apk" -exec cp {} apk-output/ \;
          ls -lh apk-output
          test -n "$(find apk-output -name '*.apk' -print -quit)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SQLplayer-APK
          path: apk-output/*.apk
          if-no-files-found: error
