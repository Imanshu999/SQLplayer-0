name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore core
        run: |
          if [ ! -f core/settings.gradle.kts ]; then rm -rf core; git clone --depth 1 --branch multiplatform https://github.com/maxrave-dev/core.git core; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew && ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: androidApp/build/outputs/apk/release/*.apk
